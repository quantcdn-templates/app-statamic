services:
  statamic:
    image: ghcr.io/quantcdn-templates/app-statamic:latest
    build: .
    restart: unless-stopped
    # Ports defined in docker-compose.override.yml for local dev
    # Quant Cloud handles routing in production
    volumes:
      # Persistent storage for Statamic content, users, and storage directories
      - statamic_content:/var/www/html/content
      - statamic_users:/var/www/html/users
      - statamic_storage:/var/www/html/storage
    environment:
      # Laravel/Statamic Configuration
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost}
      - LOG_CHANNEL=${LOG_CHANNEL:-stderr}
      - LOG_LEVEL=${LOG_LEVEL:-error}

      # Statamic Configuration
      - STATAMIC_LICENSE_KEY=${STATAMIC_LICENSE_KEY:-}
      - STATAMIC_STACHE_WATCHER=${STATAMIC_STACHE_WATCHER:-false}

      # Cache Configuration (flat-file by default)
      - CACHE_DRIVER=${CACHE_DRIVER:-file}
      - SESSION_DRIVER=${SESSION_DRIVER:-file}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-sync}

      # SMTP Configuration
      - QUANT_SMTP_RELAY_ENABLED=${QUANT_SMTP_RELAY_ENABLED:-false}
      - QUANT_SMTP_HOST=${QUANT_SMTP_HOST}
      - QUANT_SMTP_PORT=${QUANT_SMTP_PORT:-587}
      - QUANT_SMTP_USERNAME=${QUANT_SMTP_USERNAME}
      - QUANT_SMTP_PASSWORD=${QUANT_SMTP_PASSWORD}
      - QUANT_SMTP_FROM=${QUANT_SMTP_FROM}
      - QUANT_SMTP_FROM_NAME=${QUANT_SMTP_FROM_NAME}

      # Debug Configuration
      - QUANT_DEBUG=${QUANT_DEBUG:-0}
      - LOG_DEBUG=${LOG_DEBUG:-0}

      # Quant Plugin Environment Variables
      - QUANT_ENABLED=${QUANT_ENABLED}
      - QUANT_DISABLE_TLS_VERIFY=${QUANT_DISABLE_TLS_VERIFY}
      - QUANT_HTTP_REQUEST_TIMEOUT=${QUANT_HTTP_REQUEST_TIMEOUT}
      - QUANT_WEBSERVER_URL=${QUANT_WEBSERVER_URL}
      - QUANT_WEBSERVER_HOST=${QUANT_WEBSERVER_HOST}
      - QUANT_API_ENDPOINT=${QUANT_API_ENDPOINT}
      - QUANT_CUSTOMER=${QUANT_CUSTOMER}
      - QUANT_PROJECT=${QUANT_PROJECT}
      - QUANT_TOKEN=${QUANT_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  statamic_content:
  statamic_users:
  statamic_storage:
