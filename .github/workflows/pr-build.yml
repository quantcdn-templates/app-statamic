# Required check for every pull request to main (operator decision 2026-11-19): the lockfiles must match
# their manifests, the image must build from them, and Statamic must load. Dependabot auto-merge waits for
# this. It never pushes and never writes the build cache (a PR must not poison the cache main builds use).
name: pr-build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: composer.lock matches composer.json
        run: |
          docker run --rm -v "$PWD/src:/app" -w /app --entrypoint sh ghcr.io/quantcdn-templates/app-apache-php:8.4 \
            -c 'COMPOSER_HOME=$(mktemp -d) composer validate --no-check-publish --no-check-all'

      - name: package-lock.json matches package.json
        run: |
          docker run --rm -v "$PWD/src:/app" -w /app node:22-alpine \
            sh -c 'npm ci --dry-run --ignore-scripts --no-audit --no-fund >/dev/null'

      - uses: docker/setup-buildx-action@v4

      - name: Build image (amd64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          pull: true
          tags: pr-build:test
          cache-from: type=gha

      - name: Autoloader and Statamic load
        run: |
          docker run --rm --entrypoint sh pr-build:test -c '
            set -e
            cd /var/www/html
            php -r "require \"vendor/autoload.php\"; echo \"statamic/cms \", Composer\InstalledVersions::getPrettyVersion(\"statamic/cms\"), PHP_EOL;"
            test -f public/build/manifest.json
          '
